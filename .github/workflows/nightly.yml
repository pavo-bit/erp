name: Nightly Shuffled Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  shuffled:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nightly-postgres
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./ssvm-backend
    env:
      DATABASE_URL: postgresql://postgres:nightly-postgres@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:nightly-postgres@localhost:5432/ssvm_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Run shuffled suite (${{ matrix.run }}/3)
        run: |
          SEED=$((10000 + RANDOM % 90000))
          echo "Shuffle seed: $SEED"
          npx vitest run --sequence.shuffle --sequence.seed=$SEED