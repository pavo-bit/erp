name: SSVM ERP Production CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ssvm-erp-backend
  REGISTRY: ghcr.io

jobs:
  receipt-duplicate-precheck:
    name: Receipt Duplicate Pre-Check (Real DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Pre-check duplicate receipt numbers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 << 'EOF'
          DO $$
          BEGIN
            IF to_regclass('"invoices"') IS NOT NULL THEN
              IF EXISTS (SELECT 1 FROM "invoices" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1) THEN
                RAISE EXCEPTION 'Pre-check failed: Duplicate receipt numbers found in invoices table!';
              END IF;
            END IF;
            IF to_regclass('"payment_transactions"') IS NOT NULL THEN
              IF EXISTS (SELECT 1 FROM "payment_transactions" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1) THEN
                RAISE EXCEPTION 'Pre-check failed: Duplicate receipt numbers found in payment_transactions table!';
              END IF;
            END IF;
          END $$;
          EOF
          echo "Pre-check passed: No duplicate receipt numbers found."

  test-and-build:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    needs: receipt-duplicate-precheck

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ssvm-backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./ssvm-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./ssvm-backend
        run: npx prisma generate

      - name: Type Check (Strict)
        working-directory: ./ssvm-backend
        run: npx tsc --noEmit

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Local Test)
        working-directory: ./ssvm-backend
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # - name: Push Docker Image
      #   working-directory: ./ssvm-backend
      #   run: |
      #     docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}:latest
