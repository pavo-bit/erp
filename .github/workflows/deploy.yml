name: SSVM ERP Production CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ssvm-erp-backend
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./ssvm-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./ssvm-backend
        run: npx prisma generate

      - name: Type Check (Strict)
        working-directory: ./ssvm-backend
        run: npx tsc --noEmit

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Local Test)
        working-directory: ./ssvm-backend
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # - name: Push Docker Image
      #   working-directory: ./ssvm-backend
      #   run: |
      #     docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}:latest
