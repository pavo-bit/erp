name: SSVM Backend CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ssvm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ssvm-backend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./ssvm-backend
      run: npm ci
      
    - name: Generate Prisma Client
      working-directory: ./ssvm-backend
      run: npx prisma generate
      
    - name: Run Database Migrations
      working-directory: ./ssvm-backend
      env:
        DATABASE_URL: postgresql://ssvm:password@localhost:5432/ssvm_test
      run: npx prisma migrate deploy
      
    - name: Type check
      working-directory: ./ssvm-backend
      run: npx tsc --noEmit
      
    - name: Run Tests
      working-directory: ./ssvm-backend
      env:
        DATABASE_URL: postgresql://ssvm:password@localhost:5432/ssvm_test
        REDIS_URL: redis://localhost:6379
        ACCESS_TOKEN_SECRET: test_secret
        REFRESH_TOKEN_SECRET: test_refresh_secret
      run: npm run test
