name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop
      - 'remediation/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./ssvm-backend

    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_ADMIN: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Check tenant classification
        run: npm run db:tenant-classification:check

      - name: Provision restricted test role
        run: |
          psql --host localhost --username postgres --dbname ssvm_test \
            --set=ON_ERROR_STOP=1 --set=app_password="$APP_DB_PASSWORD" --set=fixture_password="$FIXTURE_DB_PASSWORD" --set=auth_password="$AUTH_DB_PASSWORD" <<'SQL'
          SELECT format(
            'CREATE ROLE ssvm_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
            :'app_password'
          )
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ssvm_app')
          \gexec

          GRANT CONNECT ON DATABASE ssvm_test TO ssvm_app;
          GRANT USAGE ON SCHEMA public TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ssvm_app;

          SELECT format(
            'CREATE ROLE ssvm_fixture WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION BYPASSRLS PASSWORD %L',
            :'fixture_password'
          )
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ssvm_fixture')
          \gexec

          GRANT CONNECT ON DATABASE ssvm_test TO ssvm_fixture;
          GRANT USAGE ON SCHEMA public TO ssvm_fixture;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ssvm_fixture;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ssvm_fixture;

          SELECT format(
            'CREATE ROLE ssvm_auth WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
            :'auth_password'
          )
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ssvm_auth')
          \gexec

          GRANT CONNECT ON DATABASE ssvm_test TO ssvm_auth;
          GRANT USAGE ON SCHEMA public TO ssvm_auth;

          CREATE DATABASE ssvm_shadow;
          SQL

      - name: Deploy full schema and RLS migrations as owner role
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Grant restricted role privileges
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO ssvm_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ssvm_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ssvm_app;

          GRANT USAGE ON SCHEMA public TO ssvm_fixture;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ssvm_fixture;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO ssvm_fixture;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ssvm_fixture;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ssvm_fixture;

          GRANT USAGE ON SCHEMA public TO ssvm_auth;
          GRANT SELECT, INSERT, UPDATE ON users TO ssvm_auth;
          GRANT SELECT ON schools TO ssvm_auth;
          GRANT SELECT, INSERT, UPDATE, DELETE ON user_sessions TO ssvm_auth;
          GRANT SELECT, INSERT, UPDATE, DELETE ON refresh_tokens TO ssvm_auth;
          GRANT SELECT, INSERT ON audit_logs TO ssvm_auth;
          GRANT SELECT, INSERT ON system_logs TO ssvm_auth;
          GRANT SELECT, INSERT ON auth_events TO ssvm_auth;
          GRANT SELECT, UPDATE ON students TO ssvm_auth;
          GRANT SELECT ON teachers, guardians, alumni TO ssvm_auth;
          GRANT SELECT ON academic_sessions, classes, sections TO ssvm_auth;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ssvm_auth;

          DROP POLICY IF EXISTS auth_user_login ON users;
          CREATE POLICY auth_user_login ON users FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());

          DROP POLICY IF EXISTS auth_sessions ON user_sessions;
          CREATE POLICY auth_sessions ON user_sessions FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR EXISTS (
              SELECT 1 FROM users tenant_ref_0
              WHERE user_sessions."userId" = tenant_ref_0.id AND tenant_ref_0."schoolId" = current_tenant_id()
            )) 
            WITH CHECK (current_user = 'ssvm_auth' OR EXISTS (
              SELECT 1 FROM users tenant_ref_0
              WHERE user_sessions."userId" = tenant_ref_0.id AND tenant_ref_0."schoolId" = current_tenant_id()
            ));

          DROP POLICY IF EXISTS auth_refresh_tokens ON refresh_tokens;
          CREATE POLICY auth_refresh_tokens ON refresh_tokens FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR EXISTS (
              SELECT 1 FROM users tenant_ref_0
              WHERE refresh_tokens."userId" = tenant_ref_0.id AND tenant_ref_0."schoolId" = current_tenant_id()
            )) 
            WITH CHECK (current_user = 'ssvm_auth' OR EXISTS (
              SELECT 1 FROM users tenant_ref_0
              WHERE refresh_tokens."userId" = tenant_ref_0.id AND tenant_ref_0."schoolId" = current_tenant_id()
            ));

          DROP POLICY IF EXISTS auth_students ON students;
          CREATE POLICY auth_students ON students FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());

          DROP POLICY IF EXISTS auth_guardians ON guardians;
          CREATE POLICY auth_guardians ON guardians FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());

          DROP POLICY IF EXISTS auth_alumni ON alumni;
          CREATE POLICY auth_alumni ON alumni FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR EXISTS (
              SELECT 1 FROM users tenant_ref_0
              WHERE alumni."userId" = tenant_ref_0.id AND tenant_ref_0."schoolId" = current_tenant_id()
            )) 
            WITH CHECK (current_user = 'ssvm_auth' OR EXISTS (
              SELECT 1 FROM users tenant_ref_0
              WHERE alumni."userId" = tenant_ref_0.id AND tenant_ref_0."schoolId" = current_tenant_id()
            ));

          DROP POLICY IF EXISTS auth_teachers ON teachers;
          CREATE POLICY auth_teachers ON teachers FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());

          DROP POLICY IF EXISTS auth_audit_logs ON audit_logs;
          CREATE POLICY auth_audit_logs ON audit_logs FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());

          DROP POLICY IF EXISTS auth_system_logs ON system_logs;
          CREATE POLICY auth_system_logs ON system_logs FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());

          DROP POLICY IF EXISTS auth_role_events ON auth_events;
          CREATE POLICY auth_role_events ON auth_events FOR ALL TO ssvm_auth 
            USING (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id()) 
            WITH CHECK (current_user = 'ssvm_auth' OR "schoolId" = current_tenant_id());
          SQL

      - name: Show database identity and policy count
        run: |
          PGPASSWORD="$APP_DB_PASSWORD" psql --host localhost --username ssvm_app --dbname ssvm_test \
            --command 'SELECT current_user, r.rolsuper, r.rolbypassrls, (SELECT count(*) FROM pg_policy) AS policy_count FROM pg_roles r WHERE r.rolname = current_user;'

      - name: Run Tests with Coverage
        run: npm run test:ci

      - name: Run Shuffled Parallel Tests
        run: |
          SHUFFLE_SEED=$((10000 + RANDOM % 90000))
          echo "Running vitest with sequence.shuffle and seed: $SHUFFLE_SEED"
          npx vitest run --sequence.shuffle --sequence.seed=$SHUFFLE_SEED

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./ssvm-backend/test-results.xml
          if-no-files-found: warn

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./ssvm-backend/coverage/
          fail_ci_if_error: false
          flags: backend

  database-rls:
    name: Migrate and RLS Tests (restricted role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./ssvm-backend
    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Check tenant classification
        run: npm run db:tenant-classification:check
      - name: Provision restricted RLS test role
        run: |
          psql --host localhost --username postgres --dbname ssvm_test \
            --set=ON_ERROR_STOP=1 --set=app_password="$APP_DB_PASSWORD" <<'SQL'
          SELECT format(
            'CREATE ROLE ssvm_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
            :'app_password'
          )
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ssvm_app')
          \gexec
          GRANT CONNECT ON DATABASE ssvm_test TO ssvm_app;
          GRANT USAGE ON SCHEMA public TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ssvm_app;
          CREATE DATABASE ssvm_shadow;
          SQL
      - name: Deploy full schema and RLS migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
      - name: Verify schema matches Prisma datamodel
        run: npm run db:verify-diff
      - name: Verify all model tables and payment unique index
        run: npm run db:verify-tables
      - name: Run PostgreSQL RLS and ledger invariant tests
        run: npm run test:rls

  backend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: TypeScript Check
        run: npm run type-check

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Lint Code
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [erp-admin, super-admin, teacher-portal, parent-portal, payment-portal, student-portal, saas-frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'
      - run: npm ci
      - name: Build Next.js App
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Backend)
        working-directory: ./ssvm-backend
        run: npm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
