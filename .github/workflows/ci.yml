name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./ssvm-backend

    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Provision restricted test role
        run: |
          psql --host localhost --username postgres --dbname ssvm_test \
            --set=ON_ERROR_STOP=1 --set=app_password="$APP_DB_PASSWORD" <<'SQL'
          SELECT format(
            'CREATE ROLE ssvm_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
            :'app_password'
          )
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ssvm_app')
          \gexec

          GRANT CONNECT ON DATABASE ssvm_test TO ssvm_app;
          GRANT USAGE ON SCHEMA public TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ssvm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ssvm_app;
          SQL

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Run Tests with Coverage
        run: npm run test:ci

      - name: Run PostgreSQL RLS tests
        run: npm run test:rls

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./ssvm-backend/coverage/
          fail_ci_if_error: true
          flags: backend

  backend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: TypeScript Check
        run: npm run type-check

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Lint Code
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [erp-admin, super-admin, teacher-portal, parent-portal, payment-portal, student-portal, saas-frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'
      - run: npm ci
      - name: Build Next.js App
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Backend)
        working-directory: ./ssvm-backend
        run: npm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
