name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop
      - 'remediation/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./ssvm-backend

    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_ADMIN: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Check tenant classification
        run: npm run db:tenant-classification:check

      - name: Create shadow database
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 -c "CREATE DATABASE ssvm_shadow;"

      - name: Deploy full schema and RLS migrations as owner role
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql

      - name: Show database identity and policy count
        run: |
          PGPASSWORD="$APP_DB_PASSWORD" psql --host localhost --username ssvm_app --dbname ssvm_test \
            --command 'SELECT current_user, r.rolsuper, r.rolbypassrls, (SELECT count(*) FROM pg_policy) AS policy_count FROM pg_roles r WHERE r.rolname = current_user;'

      - name: Run Tests with Coverage
        run: |
          npm run test:ci 2>&1 | tee test-ci-coverage.log

      - name: Run Shuffled Parallel Tests (Full Backend Suite)
        run: |
          SHUFFLE_SEED=$((10000 + RANDOM % 90000))
          echo "Running vitest full backend test suite with sequence.shuffle and seed: $SHUFFLE_SEED"
          echo "### 🎲 Shuffled Backend Test Suite" >> $GITHUB_STEP_SUMMARY
          echo "- **Shuffle Seed:** \`$SHUFFLE_SEED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope:** Full backend test suite (all unit, API, security, multitenancy, architecture tests)" >> $GITHUB_STEP_SUMMARY
          npx vitest run --sequence.shuffle --sequence.seed=$SHUFFLE_SEED 2>&1 | tee test-shuffled.log
          echo "- **Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY

      - name: Upload backend test logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: |
            ./ssvm-backend/test-results.xml
            ./ssvm-backend/test-ci-coverage.log
            ./ssvm-backend/test-shuffled.log
          if-no-files-found: warn

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ./ssvm-backend/coverage/
          if-no-files-found: warn

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./ssvm-backend/coverage/
          fail_ci_if_error: false
          flags: backend

  database-rls:
    name: Migrate and RLS Tests (restricted role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./ssvm-backend
    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Check tenant classification
        run: npm run db:tenant-classification:check
      - name: Create shadow database
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 -c "CREATE DATABASE ssvm_shadow;"
      - name: Pre-check duplicate receipt numbers
        run: |
          echo "Pre-check: Verifying no duplicate receiptNo exists on Invoice or payment_transactions..."
          DUPLICATE_INVOICE_QUERY='SELECT "schoolId", "receiptNo", COUNT(*) FROM "Invoice" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1;'
          echo "Query 1: $DUPLICATE_INVOICE_QUERY"
          INVOICE_DUPS=$(PGPASSWORD="$PGPASSWORD" psql --host localhost --username postgres --dbname ssvm_test -t -A -c "$DUPLICATE_INVOICE_QUERY" 2>&1 || true)
          if echo "$INVOICE_DUPS" | grep -v 'relation "Invoice" does not exist' | grep -q '[^[:space:]]'; then
            echo "ERROR: Duplicate receipt numbers found in Invoice:"
            echo "$INVOICE_DUPS"
            exit 1
          fi

          DUPLICATE_TX_QUERY='SELECT "schoolId", "receiptNo", COUNT(*) FROM "payment_transactions" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1;'
          echo "Query 2: $DUPLICATE_TX_QUERY"
          TX_DUPS=$(PGPASSWORD="$PGPASSWORD" psql --host localhost --username postgres --dbname ssvm_test -t -A -c "$DUPLICATE_TX_QUERY" 2>&1 || true)
          if echo "$TX_DUPS" | grep -v 'relation "payment_transactions" does not exist' | grep -q '[^[:space:]]'; then
            echo "ERROR: Duplicate receipt numbers found in payment_transactions:"
            echo "$TX_DUPS"
            exit 1
          fi
          echo "Pre-check passed: No duplicate receipt numbers found."
      - name: Deploy full schema and RLS migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql
      - name: Verify schema matches Prisma datamodel
        run: npm run db:verify-diff
      - name: Verify all model tables and payment unique index
        run: npm run db:verify-tables
      - name: Run PostgreSQL RLS and ledger invariant tests
        run: npm run test:rls
      - name: Run Database Upgrade Flow Test
        run: npx tsx scripts/test-upgrade-flow.ts
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ${{ env.PGPASSWORD }}
          APP_DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          DATABASE_URL_ADMIN: ${{ env.DATABASE_URL_ADMIN }}

  backend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: TypeScript Check
        run: npm run type-check

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Lint Code and Check Ratchet
        run: |
          npm run lint 2>&1 | tee lint-output.log
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-logs
          path: ./ssvm-backend/lint-output.log
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [erp-admin, super-admin, teacher-portal, parent-portal, payment-portal, student-portal, saas-frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'
      - run: npm ci
      - name: Build Next.js App
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Backend)
        working-directory: ./ssvm-backend
        run: npm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
