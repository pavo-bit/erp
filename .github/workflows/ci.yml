name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'lane/**'
      - 'remediation/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'remediation/**'
      - 'lane/**'
      - 'feature/**'
      - 'fix/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      grafana:
        image: grafana/grafana:11.3.1
        ports:
          - 3004:3000
        env:
          GF_AUTH_PROXY_ENABLED: "true"
          GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
          GF_AUTH_PROXY_HEADER_PROPERTY: "username"
          GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
          GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
          GF_USERS_ALLOW_SIGN_UP: "false"
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:3000/api/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: ./ssvm-backend

    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_ADMIN: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
      DATABASE_URL_GRAFANA: postgresql://ssvm_grafana_ro:grafana_ro_secure_pass_2026@localhost:5432/ssvm_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Check tenant classification
        run: npm run db:tenant-classification:check

      - name: Create shadow database
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 -c "CREATE DATABASE ssvm_shadow;"

      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql

      - name: Deploy full schema and RLS migrations as owner role
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Re-apply database roles and grants on deployed schema
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql

      - name: Show database identity and policy count
        run: |
          PGPASSWORD="$APP_DB_PASSWORD" psql --host localhost --username ssvm_app --dbname ssvm_test \
            --command 'SELECT current_user, r.rolsuper, r.rolbypassrls, (SELECT count(*) FROM pg_policy) AS policy_count FROM pg_roles r WHERE r.rolname = current_user;'

      - name: Run Tests with Coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test-ci-coverage.log

      - name: Run Shuffled Parallel Tests (Full Backend Suite)
        shell: bash
        run: |
          set -o pipefail
          SHUFFLE_SEED=$((10000 + RANDOM % 90000))
          echo "Running vitest full backend test suite with sequence.shuffle and seed: $SHUFFLE_SEED"
          echo "### 🎲 Shuffled Backend Test Suite" >> $GITHUB_STEP_SUMMARY
          echo "- **Shuffle Seed:** \`$SHUFFLE_SEED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope:** Full backend test suite (all unit, API, security, multitenancy, architecture tests)" >> $GITHUB_STEP_SUMMARY
          npx vitest run --sequence.shuffle --sequence.seed=$SHUFFLE_SEED 2>&1 | tee test-shuffled.log
          echo "- **Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY

      - name: Upload backend test logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: |
            ./ssvm-backend/test-results.xml
            ./ssvm-backend/test-ci-coverage.log
            ./ssvm-backend/test-shuffled.log
          if-no-files-found: warn

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ./ssvm-backend/coverage/
          if-no-files-found: warn

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./ssvm-backend/coverage/
          fail_ci_if_error: false
          flags: backend

  database-rls:
    name: Migrate and RLS Tests (restricted role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./ssvm-backend
    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Check tenant classification
        run: npm run db:tenant-classification:check
      - name: Create shadow database
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 -c "CREATE DATABASE ssvm_shadow;"
      - name: Pre-check duplicate receipt numbers
        run: |
          echo "Pre-check: Verifying no duplicate receipt numbers exist to block unique indexes..."
          DUPLICATE_INVOICE_QUERY='SELECT "schoolId", "receiptNo", COUNT(*) FROM "invoices" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1;'
          DUPLICATE_TX_QUERY='SELECT "schoolId", "receiptNo", COUNT(*) FROM "payment_transactions" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1;'
          echo "Query 1: $DUPLICATE_INVOICE_QUERY"
          echo "Query 2: $DUPLICATE_TX_QUERY"

          PGPASSWORD="$PGPASSWORD" psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 << 'EOF'
          DO $$
          BEGIN
            IF to_regclass('"invoices"') IS NOT NULL THEN
              IF EXISTS (SELECT 1 FROM "invoices" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1) THEN
                RAISE EXCEPTION 'Pre-check failed: Duplicate receipt numbers found in invoices table!';
              END IF;
            END IF;
            IF to_regclass('"payment_transactions"') IS NOT NULL THEN
              IF EXISTS (SELECT 1 FROM "payment_transactions" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1) THEN
                RAISE EXCEPTION 'Pre-check failed: Duplicate receipt numbers found in payment_transactions table!';
              END IF;
            END IF;
          END $$;
          EOF
          echo "Pre-check passed: No duplicate receipt numbers found."
      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql
      - name: Deploy full schema and RLS migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
      - name: Re-apply database roles and grants on deployed schema
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql
      - name: Verify schema matches Prisma datamodel
        run: npm run db:verify-diff
      - name: Verify all model tables and payment unique index
        run: npm run db:verify-tables
      - name: Verify unique receipt numbers on deployed schema
        run: |
          echo "Verifying no duplicate receipt numbers on deployed tables..."
          PGPASSWORD="$PGPASSWORD" psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -c 'SELECT "schoolId", "receiptNo", COUNT(*) FROM "invoices" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1;' \
            -c 'SELECT "schoolId", "receiptNo", COUNT(*) FROM "payment_transactions" WHERE "receiptNo" IS NOT NULL GROUP BY "schoolId", "receiptNo" HAVING COUNT(*) > 1;'
      - name: Run PostgreSQL RLS and ledger invariant tests
        run: npm run test:rls
      - name: Run Database Upgrade Flow Test
        run: npx tsx scripts/test-upgrade-flow.ts
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ${{ env.PGPASSWORD }}
          APP_DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          DATABASE_URL_ADMIN: ${{ env.DATABASE_URL_ADMIN }}

  backend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: TypeScript Check
        run: npm run type-check

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Lint Code and Check Ratchet
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.log
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-logs
          path: ./ssvm-backend/lint-output.log
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [erp-admin, super-admin, teacher-portal, parent-portal, payment-portal, student-portal, saas-frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Build Next.js App
        run: npm run build

  api-hooks-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check canonical api-hooks core
        run: node scripts/check-api-hooks-sync.js

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      REDIS_URL: redis://localhost:6379
      PORT: 5000
      BACKEND_URL: http://localhost:5000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./ssvm-backend/package-lock.json
            ./e2e-tests/package-lock.json
            ./erp-admin/package-lock.json
            ./super-admin/package-lock.json
            ./teacher-portal/package-lock.json
            ./student-portal/package-lock.json
            ./parent-portal/package-lock.json
            ./payment-portal/package-lock.json
            ./saas-frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./ssvm-backend
        run: npm ci

      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f ssvm-backend/scripts/db/provision-roles.sql

      - name: Deploy Database Migrations
        working-directory: ./ssvm-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Seed Database
        working-directory: ./ssvm-backend
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}

      - name: Start Backend Server
        working-directory: ./ssvm-backend
        run: |
          npm run dev &
          for i in {1..30}; do
            if curl -s http://localhost:5000/api/v1/health | grep -q "ok\|true\|UP"; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Install Frontend Portal Dependencies
        shell: bash
        run: |
          set -euo pipefail
          for app in erp-admin super-admin teacher-portal student-portal parent-portal payment-portal saas-frontend; do
            echo "Installing $app"
            (cd "$app" && npm ci)
          done

      - name: Build All Seven Portals for Browser Tests
        shell: bash
        env:
          BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          for app in erp-admin super-admin teacher-portal student-portal parent-portal payment-portal saas-frontend; do
            echo "Building $app"
            (cd "$app" && npm run build)
          done

      - name: Start All Seven Portal Servers
        shell: bash
        env:
          BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: |
          set -euo pipefail
          start_portal() {
            local app="$1"
            local port="$2"
            (
              cd "$app"
              nohup npx next start -p "$port" > "$RUNNER_TEMP/$app.log" 2>&1 < /dev/null &
              echo $! > "$RUNNER_TEMP/$app.pid"
            )
          }

          start_portal erp-admin 3000
          start_portal super-admin 3001
          start_portal teacher-portal 3002
          start_portal student-portal 3003
          start_portal parent-portal 3006
          start_portal payment-portal 3007
          start_portal saas-frontend 3008

          for item in "erp-admin:3000" "super-admin:3001" "teacher-portal:3002" "student-portal:3003" "parent-portal:3006" "payment-portal:3007" "saas-frontend:3008"; do
            app="${item%%:*}"
            port="${item##*:}"
            ready=0
            for attempt in {1..60}; do
              status="$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:$port/" || true)"
              if [[ "$status" =~ ^[23][0-9][0-9]$ ]]; then
                ready=1
                break
              fi
              sleep 2
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "Portal $app did not become ready on port $port"
              cat "$RUNNER_TEMP/$app.log" || true
              exit 1
            fi
            echo "$app ready at http://localhost:$port"
          done

      - name: Install E2E Dependencies
        working-directory: ./e2e-tests
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./e2e-tests
        run: npx playwright install --with-deps chromium

      - name: E2E Type-Check
        working-directory: ./e2e-tests
        run: npm run type-check

      - name: Run Playwright Tests
        working-directory: ./e2e-tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./e2e-tests/playwright-report/
          retention-days: 14

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Backend)
        working-directory: ./ssvm-backend
        run: npm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivyignores: '.trivyignore'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
