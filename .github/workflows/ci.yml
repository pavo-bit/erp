name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'lane/**'
      - 'remediation/**'
  pull_request:
    branches:
      - main
      - develop
      - 'remediation/**'
      - 'lane/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./ssvm-backend

    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_ADMIN: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Check tenant classification
        run: npm run db:tenant-classification:check

      - name: Create shadow database
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 -c "CREATE DATABASE ssvm_shadow;"

      - name: Deploy full schema and RLS migrations as owner role
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql

      - name: Show database identity and policy count
        run: |
          PGPASSWORD="$APP_DB_PASSWORD" psql --host localhost --username ssvm_app --dbname ssvm_test \
            --command 'SELECT current_user, r.rolsuper, r.rolbypassrls, (SELECT count(*) FROM pg_policy) AS policy_count FROM pg_roles r WHERE r.rolname = current_user;'

      - name: Run Tests with Coverage (Shard ${{ matrix.shard }}/4)
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=test-results-${{ matrix.shard }}.xml --shard=${{ matrix.shard }}/4 --no-file-parallelism

      - name: Run Shuffled Parallel Tests
        run: |
          SHUFFLE_SEED=$((10000 + RANDOM % 90000))
          echo "Running vitest with sequence.shuffle and seed: $SHUFFLE_SEED"
          npx vitest run --sequence.shuffle --sequence.seed=$SHUFFLE_SEED

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./ssvm-backend/test-results.xml
          if-no-files-found: warn

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./ssvm-backend/coverage/
          fail_ci_if_error: false
          flags: backend

  database-rls:
    name: Migrate and RLS Tests (restricted role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-postgres-ci
          POSTGRES_DB: ssvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./ssvm-backend
    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-app-ci
      FIXTURE_DB_PASSWORD: ${{ github.run_id }}-fixture-ci
      AUTH_DB_PASSWORD: ${{ github.run_id }}-auth-ci
      TRUSTED_DB_PASSWORD: ${{ github.run_id }}-trusted-ci
      PGPASSWORD: ${{ github.run_id }}-postgres-ci
      DATABASE_URL_TEST: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TEST_FIXTURE: postgresql://ssvm_fixture:${{ github.run_id }}-fixture-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_AUTH: postgresql://ssvm_auth:${{ github.run_id }}-auth-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL_TRUSTED: postgresql://ssvm_trusted:${{ github.run_id }}-trusted-ci@localhost:5432/ssvm_test?schema=public
      DATABASE_URL: postgresql://ssvm_app:${{ github.run_id }}-app-ci@localhost:5432/ssvm_test?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-postgres-ci@localhost:5432/ssvm_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Check tenant classification
        run: npm run db:tenant-classification:check
      - name: Create shadow database
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 -c "CREATE DATABASE ssvm_shadow;"
      - name: Deploy full schema and RLS migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
      - name: Provision database roles and grants
        run: |
          psql --host localhost --username postgres --dbname ssvm_test --set=ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" \
            -v fixture_password="$FIXTURE_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -v trusted_password="$TRUSTED_DB_PASSWORD" \
            -f scripts/db/provision-roles.sql
      - name: Verify schema matches Prisma datamodel
        run: npm run db:verify-diff
      - name: Verify all model tables and payment unique index
        run: npm run db:verify-tables
      - name: Run PostgreSQL RLS and ledger invariant tests
        run: npm run test:rls

  backend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: TypeScript Check
        run: npm run type-check

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ssvm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ssvm-backend/package-lock.json'
      - run: npm ci
      - name: Lint Code
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [erp-admin, super-admin, teacher-portal, parent-portal, payment-portal, student-portal, saas-frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'
      - run: npm ci
      - name: Build Next.js App
        run: npm run build

  e2e-harness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: E2E harness (non-blocking)
        run: |
          echo "E2E harness placeholder - docker-compose.e2e.yml present"
          test -f docker-compose.e2e.yml

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Backend)
        working-directory: ./ssvm-backend
        run: npm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
