# ═══════════════════════════════════════════════════════════════════════
# SSVM College Square — Microservices Architecture
# ═══════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────
  # 1. DATABASE
  # ─────────────────────────────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: ssvm-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ssvm_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - ssvm_database:/var/lib/postgresql/data
    networks:
      - ssvm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ssvm_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 1.2 PGBOUNCER (PostgreSQL Connection Pooling)
  # ─────────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ssvm-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: database
      DB_NAME: ${POSTGRES_DB:-ssvm_platform}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 1.5 REDIS (Caching, Rate Limiting, Job Queue)
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ssvm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ssvm_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ssvm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # 2. BACKEND API
  # ─────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./ssvm-backend
      dockerfile: Dockerfile
    container_name: ssvm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-ssvm_platform}?pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-ssvm_platform}
      PORT: 5000
      ACCESS_TOKEN_PRIVATE_KEY: ${ACCESS_TOKEN_PRIVATE_KEY:-}
      ACCESS_TOKEN_PUBLIC_KEY: ${ACCESS_TOKEN_PUBLIC_KEY:-}
      REFRESH_TOKEN_PRIVATE_KEY: ${REFRESH_TOKEN_PRIVATE_KEY:-}
      REFRESH_TOKEN_PUBLIC_KEY: ${REFRESH_TOKEN_PUBLIC_KEY:-}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ssvm_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ssvm-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # 3. ERP ADMIN DASHBOARD
  # ─────────────────────────────────────────────────────────────────────
  erp-admin:
    build:
      context: ./erp-admin
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: ssvm-erp-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:5000
      ACCESS_TOKEN_PUBLIC_KEY: ${ACCESS_TOKEN_PUBLIC_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 4. SUPER ADMIN DASHBOARD
  # ─────────────────────────────────────────────────────────────────────
  super-admin:
    build:
      context: ./super-admin
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: ssvm-super-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      BACKEND_URL: http://backend:5000
      ACCESS_TOKEN_PUBLIC_KEY: ${ACCESS_TOKEN_PUBLIC_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 5. TEACHER PORTAL
  # ─────────────────────────────────────────────────────────────────────
  teacher-portal:
    build:
      context: ./teacher-portal
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: ssvm-teacher-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      BACKEND_URL: http://backend:5000
      ACCESS_TOKEN_PUBLIC_KEY: ${ACCESS_TOKEN_PUBLIC_KEY:-}
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 6. PARENT PORTAL
  # ─────────────────────────────────────────────────────────────────────
  parent-portal:
    build:
      context: ./parent-portal
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: ssvm-parent-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      BACKEND_URL: http://backend:5000
      ACCESS_TOKEN_PUBLIC_KEY: ${ACCESS_TOKEN_PUBLIC_KEY:-}
    ports:
      - "3006:3006"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 7. PAYMENT PORTAL
  # ─────────────────────────────────────────────────────────────────────
  payment-portal:
    build:
      context: ./payment-portal
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: ssvm-payment-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3007
      BACKEND_URL: http://backend:5000
      ACCESS_TOKEN_PUBLIC_KEY: ${ACCESS_TOKEN_PUBLIC_KEY:-}
    ports:
      - "3007:3007"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 8. GRAFANA ANALYTICS
  # ─────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: ssvm-grafana
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ssvm_platform}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ssvm_grafana:/var/lib/grafana
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 9. PROMETHEUS TELEMETRY
  # ─────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ssvm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ssvm_prometheus:/prometheus
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

  # ─────────────────────────────────────────────────────────────────────
  # 10. SAAS FRONTEND
  # ─────────────────────────────────────────────────────────────────────
  saas-frontend:
    build:
      context: ./saas-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: ssvm-saas-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3008
      BACKEND_URL: http://backend:5000
    ports:
      - "3008:3008"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ssvm-network

# ─────────────────────────────────────────────────────────────────────
# Network & Volumes
# ─────────────────────────────────────────────────────────────────────
networks:
  ssvm-network:
    driver: bridge

volumes:
  ssvm_database:
    driver: local
  ssvm_uploads:
    driver: local
  ssvm_grafana:
    driver: local
  ssvm_redis:
    driver: local
  ssvm_prometheus:
    driver: local
