version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ssvm-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - ssvm-network

networks:
  ssvm-network:
    external: true
