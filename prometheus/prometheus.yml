global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["ssvm-alertmanager:9093"]

scrape_configs:
  - job_name: "ssvm-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ssvm-backend:5000"]
