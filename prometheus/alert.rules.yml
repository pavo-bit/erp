groups:
  - name: SSVM_Backend_SLOs
    rules:
      # 1. API Latency SLO (p95 > 500ms / 0.5s)
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(ssvm_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          component: backend_api
        annotations:
          summary: "High API Latency (p95 > 500ms)"
          description: "The 95th percentile of API response times is {{ $value }}s, which exceeds the 0.5s SLO threshold."

      # 2. HTTP Error Rate SLO (5xx > 2%)
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(ssvm_http_errors_total{code=~"5.."}[5m]))
          /
          sum(rate(ssvm_http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
          component: backend_api
        annotations:
          summary: "High HTTP 5xx Error Rate"
          description: "More than 2% of requests are failing with 5xx server errors over the last 5 minutes. Current rate: {{ $value | humanizePercentage }}."

      # 3. Auth Failure Spike (> 20 auth failures/min)
      - alert: AuthFailureSpike
        expr: sum(rate(ssvm_auth_failures_total[5m])) > 0.33
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Authentication Failure Spike Detected"
          description: "Authentication failures are occurring at an elevated rate of {{ $value }} per second."

      # 4. Account Lockout Spike (> 5 lockouts in 5 minutes)
      - alert: AccountLockoutSpike
        expr: sum(increase(ssvm_account_lockouts_total[5m])) > 5
        for: 1m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "Account Lockout Spike Detected"
          description: "More than 5 user accounts have been locked out in the last 5 minutes (possible credential stuffing)."

      # 5. Webhook Signature Failures
      - alert: WebhookSignatureFailures
        expr: sum(rate(ssvm_webhook_signature_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: webhooks
        annotations:
          summary: "Webhook HMAC Signature Verification Failures"
          description: "Incoming webhooks are failing HMAC signature validation. Webhook secret may be compromised or misconfigured."

      # 6. Webhook Processing Failure Rate (> 5% over 10m)
      - alert: HighWebhookFailureRate
        expr: |
          sum(rate(ssvm_webhook_processing_total{status=~"error_.*"}[10m]))
          /
          sum(rate(ssvm_webhook_processing_total[10m])) > 0.05
        for: 10m
        labels:
          severity: critical
          component: webhooks
        annotations:
          summary: "High Webhook Processing Failure Rate"
          description: "More than 5% of incoming webhooks are failing. Current failure rate: {{ $value | humanizePercentage }}."

      # 7. Background Job Queue Backlog
      - alert: HighJobQueueBacklog
        expr: ssvm_bullmq_queue_size > 100
        for: 10m
        labels:
          severity: warning
          component: background_workers
        annotations:
          summary: "BullMQ Queue Backlog is too high"
          description: "Queue '{{ $labels.queue }}' has {{ $value }} pending jobs. Workers might be stuck or down."

      # 8. Outbox Dead Letters Detected
      - alert: OutboxDeadLetters
        expr: ssvm_outbox_dead_letters_total > 0
        for: 1m
        labels:
          severity: critical
          component: background_workers
        annotations:
          summary: "Transactional Outbox Dead Letters Detected"
          description: "One or more events in outbox_events have exceeded max retries and moved to dead-letter state."

      # 9. Support Session Open Longer Than Expiry
      - alert: SupportSessionOpenLongerThanExpiry
        expr: ssvm_support_sessions_active > 0
        for: 2h
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Platform Support Session Remains Active"
          description: "A platform support session has been active for more than 2 hours. Ensure manual session closure or automatic expiry."

      # 10. Missing Webhook Events
      - alert: MissingPaymentWebhooks
        expr: |
          sum(increase(ssvm_payment_total[24h])) > 10
          and
          sum(increase(ssvm_webhook_processing_total[24h])) == 0
        for: 1h
        labels:
          severity: critical
          component: webhooks
        annotations:
          summary: "Zero webhooks received despite active payments"
          description: "Over 10 payments were initiated in the last 24h, but NO webhooks were processed. Webhook URL/Secret may be misconfigured."
