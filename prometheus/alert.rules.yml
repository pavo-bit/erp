groups:
  - name: SSVM_Backend_SLOs
    rules:
      # 1. API Latency SLO
      # Alert if the 95th percentile of HTTP request duration exceeds 500ms for 5 minutes.
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(ssvm_http_request_duration_ms_bucket[5m])) by (le)) > 500
        for: 5m
        labels:
          severity: warning
          component: backend_api
        annotations:
          summary: "High API Latency (p95 > 500ms)"
          description: "The 95th percentile of API response times is {{ $value }}ms, which exceeds the 500ms SLO threshold."

      # 2. HTTP Error Rate SLO
      # Alert if the percentage of HTTP 5xx errors is greater than 2% over 5 minutes.
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(ssvm_http_errors_total{code=~"5.."}[5m])) 
          / 
          sum(rate(ssvm_http_request_duration_ms_count[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
          component: backend_api
        annotations:
          summary: "High HTTP 5xx Error Rate"
          description: "More than 2% of requests are failing with 5xx server errors over the last 5 minutes. Current rate: {{ $value | humanizePercentage }}."

      # 3. Webhook Failure Rate SLO
      # Alert if webhook failure rate (processing/signature errors) exceeds 5% over 10 minutes.
      - alert: HighWebhookFailureRate
        expr: |
          sum(rate(ssvm_webhook_processing_total{status=~"error_.*"}[10m])) 
          / 
          sum(rate(ssvm_webhook_processing_total[10m])) > 0.05
        for: 10m
        labels:
          severity: critical
          component: webhooks
        annotations:
          summary: "High Webhook Processing Failure Rate"
          description: "More than 5% of incoming webhooks are failing (signature mismatch, config, or processing error). Current failure rate: {{ $value | humanizePercentage }}."

      # 4. Background Job Queue Backlog
      # Alert if any BullMQ queue has more than 100 pending jobs for over 10 minutes.
      - alert: HighJobQueueBacklog
        expr: ssvm_bullmq_queue_size > 100
        for: 10m
        labels:
          severity: warning
          component: background_workers
        annotations:
          summary: "BullMQ Queue Backlog is too high"
          description: "Queue '{{ $labels.queue }}' has {{ $value }} pending jobs. Workers might be stuck or down."

      # 5. Missing Webhook Events
      # Alert if we haven't received ANY webhooks for 24 hours, but we have had payments initiated.
      # (This is an advanced synthetic rule: if payments happen but no webhooks arrive, the webhook config is broken).
      - alert: MissingPaymentWebhooks
        expr: |
          sum(increase(ssvm_payment_total[24h])) > 10
          and
          sum(increase(ssvm_webhook_processing_total[24h])) == 0
        for: 1h
        labels:
          severity: critical
          component: webhooks
        annotations:
          summary: "Zero webhooks received despite active payments"
          description: "Over 10 payments were initiated in the last 24h, but NO webhooks were processed. Webhook URL/Secret may be misconfigured."
