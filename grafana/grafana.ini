[security]
allow_embedding = true

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 60
whitelist = 
headers = Role:X-WEBAUTH-ROLE
enable_login_token = false

[users]
allow_sign_up = false
default_theme = dark
