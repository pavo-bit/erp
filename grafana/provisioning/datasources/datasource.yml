apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: ssvm-database:5432
    user: ${GRAFANA_DB_USER:-ssvm_grafana_ro}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD:-grafana_ro_secure_pass_2026}
    jsonData:
      database: ${POSTGRES_DB:-ssvm_platform}
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://ssvm-prometheus:9090
    isDefault: false
    editable: false
