apiVersion: batch/v1
kind: Job
metadata:
  name: ssvm-db-provision-roles
  namespace: default
  labels:
    app.kubernetes.io/name: ssvm-db-provision-roles
    app.kubernetes.io/component: database-provisioning
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssvm-db-provision-roles
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision-roles
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
                -v app_password="$APP_DB_PASSWORD" \
                -v fixture_password="$FIXTURE_DB_PASSWORD" \
                -v auth_password="$AUTH_DB_PASSWORD" \
                -v trusted_password="$TRUSTED_DB_PASSWORD" \
                -f /scripts/provision-roles.sql
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "ssvm_platform"
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: app-password
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: auth-password
            - name: TRUSTED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: trusted-password
            - name: FIXTURE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: fixture-password
          volumeMounts:
            - name: sql-script
              mountPath: /scripts
      volumes:
        - name: sql-script
          configMap:
            name: ssvm-provision-roles-script
