apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssvm-backend
  namespace: ssvm-erp
  labels:
    app: ssvm-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ssvm-backend
  template:
    metadata:
      labels:
        app: ssvm-backend
    spec:
      containers:
        - name: ssvm-backend
          image: your-registry.com/ssvm-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: ssvm-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
