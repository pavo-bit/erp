version: "3.8"

services:
  ssvm-postgres:
    image: postgres:15-alpine
    container_name: ssvm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ssvm-redis:
    image: redis:7-alpine
    container_name: ssvm-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

  ssvm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssvm-backend
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Use internal docker networking
      - "DATABASE_URL=${DATABASE_URL:?Set the restricted application DATABASE_URL}"
      - "TRUSTED_DATABASE_URL=${TRUSTED_DATABASE_URL:?Set the separately privileged TRUSTED_DATABASE_URL}"
      - REDIS_URL=redis://ssvm-redis:6379
      - "ACCESS_TOKEN_PRIVATE_KEY=${ACCESS_TOKEN_PRIVATE_KEY:?Set the access-token private key}"
      - "ACCESS_TOKEN_PUBLIC_KEY=${ACCESS_TOKEN_PUBLIC_KEY:?Set the access-token public key}"
      - "REFRESH_TOKEN_PRIVATE_KEY=${REFRESH_TOKEN_PRIVATE_KEY:?Set the refresh-token private key}"
      - "REFRESH_TOKEN_PUBLIC_KEY=${REFRESH_TOKEN_PUBLIC_KEY:?Set the refresh-token public key}"
    depends_on:
      ssvm-postgres:
        condition: service_healthy
      ssvm-redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
