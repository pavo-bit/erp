# ═══════════════════════════════════════════
# GAP 9: Nginx Origin Hardening
# ═══════════════════════════════════════════
# Reverse proxy config for SSVM backend.
# Security features:
#   - Only allows traffic from Cloudflare IPs
#   - Real IP extraction from CF-Connecting-IP
#   - Request size limits
#   - Timeouts for slow attacks
#   - Security headers passthrough
#   - WebSocket support for SSE

upstream ssvm_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ─── Cloudflare IP Ranges ───
# Update these periodically: https://www.cloudflare.com/ips/
# Script: scripts/update-cloudflare-ips.sh

geo $is_cloudflare {
    default         0;
    # IPv4
    173.245.48.0/20   1;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    141.101.64.0/18   1;
    108.162.192.0/18  1;
    190.93.240.0/20   1;
    188.114.96.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
    162.158.0.0/15    1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    172.64.0.0/13     1;
    131.0.72.0/22     1;
    # IPv6
    2400:cb00::/32    1;
    2606:4700::/32    1;
    2803:f800::/32    1;
    2405:b500::/32    1;
    2405:8100::/32    1;
    2a06:98c0::/29    1;
    2c0f:f248::/32    1;
}

server {
    listen 80;
    server_name _;

    # ─── Block non-Cloudflare traffic in production ───
    # Uncomment these lines when Cloudflare is active:
    # if ($is_cloudflare = 0) {
    #     return 403;
    # }

    # ─── Real IP from Cloudflare ───
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # ─── Request Limits ───
    client_max_body_size 15m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ─── Security Headers ───
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Hide Server Version ───
    server_tokens off;

    # ─── API Proxy ───
    location /api/ {
        proxy_pass http://ssvm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }

    # ─── SSE (Server-Sent Events) ───
    location /api/v1/sse {
        proxy_pass http://ssvm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Disable buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ─── Webhooks (larger timeout, no buffering) ───
    location /api/v1/payments/webhook {
        proxy_pass http://ssvm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ─── Health Check (bypass Cloudflare for monitoring) ───
    location /health {
        proxy_pass http://ssvm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Metrics (restrict to internal) ───
    location /metrics {
        # Allow only internal/monitoring IPs
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://ssvm_backend;
        proxy_http_version 1.1;
    }

    # ─── Block sensitive paths ───
    location ~ /\. {
        deny all;
    }

    location ~* (\.env|\.git|docker-compose|Dockerfile) {
        deny all;
    }

    location /prisma/ {
        deny all;
    }
}
